name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run ruff check .

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: zoid_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d zoid_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # A throwaway database that exists only inside this job.
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/zoid_test
      DEBUG: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - name: Record versions
        run: |
          uv run python --version
          uv pip list | grep -Ei '^(pytest|pytest-asyncio|sqlalchemy|alembic|fastapi|asyncpg) '
      - name: Test
        run: >-
          uv run pytest -ra --durations=25
          --junitxml=artifacts/junit.xml
          --cov=app --cov-report=term-missing:skip-covered
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: artifacts/junit.xml
          if-no-files-found: warn
