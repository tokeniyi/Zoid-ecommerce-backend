[project]
name = "zoid-backend"
version = "0.1.0"
description = "Zoid Jerseys backend — FastAPI, modular hexagonal architecture."
readme = "README.md"
requires-python = ">=3.14"

# Exact dependency set supplied by the architecture.
# Do not silently upgrade or replace (Roadmap Rule 8).
dependencies = [
    "fastapi==0.141.1",
    "starlette==1.6.0",
    "uvicorn[standard]==0.53.0",

    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "python-dotenv==1.2.3",
    "email-validator==2.3.0",

    "sqlalchemy==2.0.54",
    "asyncpg==0.31.0",
    "alembic==1.20.0",

    "httpx==0.28.1",

    "pwdlib==0.3.1",
    "argon2-cffi==25.1.0",
    "PyJWT==2.14.0",

    "stripe==15.6.1",
    "resend==2.47.0",
    "cloudinary==1.46.2",
    "boto3==1.43.24",

    "redis==8.1.0",
    "fastapi-limiter==0.2.0",
    "pyrate-limiter==4.5.0",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.1.0",
    "ruff==0.16.8",
]

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4"]
ignore = ["B008"]  # FastAPI Depends() in argument defaults is idiomatic

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.lint.per-file-ignores]
# Alembic autogenerates migration modules; their template style (import
# ordering, `typing.Sequence`, long `sa.Column(...)` lines) is machine output,
# not hand-authored domain code.
"migrations/versions/*.py" = ["E501", "I001", "UP035", "UP037"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]
